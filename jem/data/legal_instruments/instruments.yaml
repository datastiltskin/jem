# data/legal_instruments/ — registry (single source of truth for transition dates)
#
# Each instrument defined + verified ONCE, referenced by id from entities/edges.
# Transition dates below are well-established; a row only reaches
# data_quality: verified once its URL has passed the liveness pre-gate AND the
# document at that URL has been confirmed to contain the instrument.
#
# One file per instrument is fine too; this registry is a single list for convenience.
#
# ── India Code status, checked 2026-09-01 ────────────────────────────────────
# The India Code portal migrated from indiacode.nic.in to indiacode.gov.in in
# August 2026. Consequences for every row seeded against the old domain:
#
#   1. Deep links on indiacode.nic.in now 404. All 12 seeded URLs failed the
#      liveness pre-gate (scripts/harness/liveness.py --instruments), as do 45
#      of the 60 india-code citations elsewhere in the corpus.
#   2. The replacement portal is a single-page app that returns a byte-identical
#      200 HTML shell for EVERY path, including nonsense ones. A 200 from it is
#      not evidence, so indiacode.gov.in URLs cannot currently serve as
#      machine-verifiable citations at all. The liveness gate rejects them as
#      soft_404_catch_all_shell rather than passing them on status alone.
#
# The three post-2023 criminal codes below are therefore cited to the MHA-hosted
# enacted texts, which are live, are Gazette-of-India publications, and were
# confirmed to contain the correct Act titles and numbers. The remaining rows
# stay data_quality: partial: their transition dates are sound, but their URLs
# are currently dead and no verified replacement has been located. Re-point them
# as live primaries are found; do not upgrade a row on a dead link.

instruments:

  - id: constitution_of_india
    title: The Constitution of India
    instrument_type: Constitution
    commenced: '1950-01-26'
    data_quality: partial
    sources:
      - { label: "Constitution of India", url: "https://www.indiacode.nic.in/handle/123456789/15240", type: Constitution }

