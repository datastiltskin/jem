# Hand-curated entity — Maharashtra food safety chain (FSS Act 2006).
id: mh_fss_adjudicating_officer
name: Adjudicating Officers under the FSS Act, Maharashtra (Joint Commissioner (Food), FDA)
abbreviation: MH FSS AO
aliases:
  - Joint Commissioner (Food)-cum-Adjudicating Officer, FDA Maharashtra

type: RegulatoryBodyQJ
cluster: regulatory_bodies
level_of_government: State
entity_scope: State
legislature_status: full

jurisdiction_scope:
  states_covered:
    - MH
  is_all_india: false
  jurisdiction_types:
    - Original
    - Regulatory

created_year: 2011
operational_status: Active

constitutional_basis: null
statutory_basis: >-
  Food Safety and Standards Act 2006 s.68 (Adjudicating Officer, not below the
  rank of Additional District Magistrate, notified by the State Government;
  imposes penalties under ss.50 to 58 after inquiry)

appointment:
  nominates: mh_commissioner_food_safety
  recommends: null
  formally_appoints: government_maharashtra
  criteria_public: true
  criteria_document_url: https://www.legitquest.com/act/joint-commissioner-food-cum-adjudicating-officer-group-a-assistant-commissioner-food-cum-designated-officer-group-a-and-food-safety-officer-group-b/C78E
  tenure: >-
    Civil service post. In Maharashtra the Adjudicating Officer is the Joint
    Commissioner (Food) of the FDA, a Group-A post filled by promotion from
    Assistant Commissioner (Food) (Recruitment Rules 2022). Rank requirement
    under s.68(1): not below Additional District Magistrate.
  reappointment_possible: false
  removal_authority: government_maharashtra
  removal_requires_parliament: false
  removal_independent_committee: false

funding:
  primary_source: State_Consolidated_Fund
  ministry_responsible: null

audit:
  audited_by: cag_india
  audit_type: CAG_Statutory
  audit_report_public: true
  conduct_oversight_body: mh_commissioner_food_safety

complaint_mechanism:
  bias_complaint_to:
    - body: mh_fsat
      mechanism: >-
        Statutory appeal to the Food Safety Appellate Tribunal under s.70(1),
        then a further appeal to the High Court on fact or law under s.71(6)
        within 60 days. This is a full external appellate chain, unlike the
        s.32(4) route for licence orders.
      complainant_has_locus: true
      is_public_process: true
      timeframe_defined: false
      external_to_judiciary: false
  criminal_prosecution:
    requires_sanction_from: mh_commissioner_food_safety
    consultation_required_with: null
    consultation_binding: null
  removal_mechanism: Departmental discipline under Maharashtra civil service rules.
  lokpal_jurisdiction: Not_Applicable
  lokayukta_jurisdiction: Varies_by_State
  source: Food Safety and Standards Act 2006 s.68, s.70, s.71

structural_gap:
  flag: true
  gaps:
    - gap_id: mh_fss_ao_departmental_adjudicator
      gap_type: Independence_Gap
      gap_severity: Moderate
      gap_description: >-
        The Adjudicating Officer who decides penalty cases brought by Food
        Safety Officers of the FDA is himself an FDA officer (Joint
        Commissioner (Food)) under the Commissioner of Food Safety. The Bombay
        High Court records the first-tier order in Tata Chemicals as that of
        the "Adjudicating Officer and Joint Commissioner, (Food), Food and Drug
        Administration, Amravati", i.e. the divisional Joint Commissioner.
        Unlike the s.32(4) route, this tier is followed by an
        external tribunal (s.70) and a High Court appeal (s.71(6)).
      gap_source: >-
        Food Safety and Standards Act 2006 s.68(1); Maharashtra Recruitment
        Rules 2022; Tata Chemicals Ltd v State of Maharashtra, Appeal Against
        Order 19 of 2019, 2024:BHC-NAG:5692 (official PDF)
      gap_since_year: 2011
      gap_status: Open
      gap_resolution_note: >-
        Indeterminate. s.68(1) requires only rank (ADM or above), not
        departmental independence.

data_quality: partial
data_quality_notes: >-
  Statutory role verified against the Act text on India Code. Maharashtra
  cadre mapping from the Recruitment Rules 2022 as reproduced on LegitQuest,
  confirmed by the Bombay High Court's description of the first-tier
  authority in Tata Chemicals (2024, official PDF) and in Ruchi Soya (2020,
  appellant "State of Maharashtra, FDA, Amravati, through Adjudicating
  Officer (Amravati Division)"), and by the Commissioner's order of
  28 July 2026, which places Joint Commissioners (Food) above the Designated
  Officers in the FDA reporting line. Modelled as one node for all
  Adjudicating Officers in the State. No case outcomes are recorded.

