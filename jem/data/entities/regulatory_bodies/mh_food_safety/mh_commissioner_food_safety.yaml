name: Commissioner of Food Safety, Maharashtra (Commissioner, Food and Drug Administration)
abbreviation: MH CFS
aliases:
  - Maharashtra FDA Commissioner
  - Commissioner, Food and Drug Administration, Maharashtra State

type: RegulatoryBodyQJ
cluster: regulatory_bodies
