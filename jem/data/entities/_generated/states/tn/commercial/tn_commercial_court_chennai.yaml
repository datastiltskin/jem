id: tn_commercial_court_chennai
name: Principal Commercial Court, Chennai
aliases:
- Commercial Court at Chennai
- Commercial Court, Egmore, Chennai
type: CommercialCourt
cluster: subordinate_courts
level_of_government: State
jurisdiction_scope:
  states_covered:
  - TN
  uts_covered: []
  is_all_india: false
  jurisdiction_types:
  - commercial_disputes
created_year: 2019
operational_status: Active
statutory_basis:
- instrument_id: commercial_courts_act_2015
  provision: s.3(1)
  status: in_force
  source: https://stationeryprinting.tn.gov.in/gazette/2019/40_II_2.pdf
- instrument_id: commercial_courts_amendment_2018
  status: in_force
  source: https://stationeryprinting.tn.gov.in/gazette/2019/40_II_2.pdf
parent_hc: hc_madras
pecuniary_jurisdiction:
  specified_value_min: 300000
  specified_value_max: 10000000
  currency: INR
  basis:
    instrument_id: commercial_courts_act_2015
    provision: s.2(1)(i)
  notes: Notification No. II(2)/HO/892/2021 constitutes the court 'with pecuniary jurisdiction of not
    less than Rs. 3 lakh and not more than Rupees One crore'. The Rs.3 lakh figure is the Specified Value
    floor introduced by the Commercial Courts (Amendment) Act 2018; it is quoted here from the TN notification,
    which states the band verbatim.
data_quality: partial
data_quality_notes: 'Constituted at District Judge level for the entire Judicial District of Chennai by
  Notification No. II(2)/HO/892/2021 under the first proviso to s.3(1), Commercial Courts Act 2015, in
  supersession of Notification No. II(2)/HO/786/2019, which had designated the Court of the Principal
  Judge, City Civil Court, Chennai as the Commercial Court. Renamed ''Principal Commercial Court'' by
  Notification No. II(2)/HO/11/2024. Structural-first entry: no case_volume, no judge_strength.'
unverified_fields:
- field: statutory_basis
  note: 'No live, openable primary text of the Commercial Courts Act 2015 or the Commercial Courts (Amendment)
    Act 2018 was reachable this run: every indiacode.nic.in/bitstream/*.pdf path returns HTTP 404 after
    the August 2026 migration, and indiacode.gov.in serves an identical 200 SPA shell for every path (soft
    404). Section numbers below are quoted as they appear inside the TN gazette notifications themselves,
    not read from the Act.'
- field: appellate_forum
  note: Appeal route is asserted from the structure of the Commercial Courts Act as recited in the notifications,
    not from an opened copy of s.13. Surfaced as a suggested edge only; see /tmp/track_c/suggested_edges.md.
- field: created_year
  note: Set to 2019, the year Chennai first had a Commercial Court notified (II(2)/HO/786/2019). The 2021
    notification supersedes rather than amends the 2019 one and shifts the court from the Principal Judge,
    City Civil Court to the District Judge level, so whether this is one continuous institution or a fresh
    constitution is not resolved by the notification text. If the maintainer reads it as a fresh constitution,
    created_year is 2021.
- field: operational_status
  note: Active is inferred from Notification No. II(2)/HO/11/2024, which amends the constituting notification
    and presupposes the court exists. No gazette posting of a Judge to this specific court was located
    this run.
