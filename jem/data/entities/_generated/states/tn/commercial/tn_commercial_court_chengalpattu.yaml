pecuniary_jurisdiction:
  specified_value_min: 2500000
  currency: INR
  basis:
    instrument_id: commercial_courts_act_2015
    provision: s.3(1)
  notes: Notification No. II(2)/HO/887/2021 constitutes this court to deal with commercial disputes 'having
    pecuniary jurisdiction of more than Rs. 25 lakh'; the floor is therefore exclusive of Rs.25,00,000.
    This is NOT the Rs.3 lakh statutory Specified Value floor (s.2(1)(i) as amended in 2018) — in TN that
    floor attaches to the Senior-Civil-Judge tier constituted by Notification No. II(2)/HO/886/2021, which
    is not emitted as an entity this run. See REPORT.md decision gate G4-sub.
data_quality: partial
data_quality_notes: 'One of three dedicated Commercial Courts at the District Judge level constituted
  at Kancheepuram at Chengalpattu by Notification No. II(2)/HO/887/2021 under s.3(1), Commercial Courts
  Act 2015, after consultation with the High Court, Madras. The same notification batch designates this
  court as the Commercial Appellate Court for its district (Notification No. II(2)/HO/888/2021, s.3A),
  so no separate tn_commercial_appellate_court_* entity is emitted — the appellate forum is this same
  court. A predecessor commercial court existed here from 2016 under the class-wide designation in Notification
  No. II(2)/HO/417/2016, superseded in 2021. Structural-first entry: no case_volume, no judge_strength.'
unverified_fields:
- field: statutory_basis
  note: 'No live, openable primary text of the Commercial Courts Act 2015 or the Commercial Courts (Amendment)
    Act 2018 was reachable this run: every indiacode.nic.in/bitstream/*.pdf path returns HTTP 404 after
    the August 2026 migration, and indiacode.gov.in serves an identical 200 SPA shell for every path (soft
    404). Section numbers below are quoted as they appear inside the TN gazette notifications themselves,
    not read from the Act.'
- field: appellate_forum
  note: Appeal route is asserted from the structure of the Commercial Courts Act as recited in the notifications,
    not from an opened copy of s.13. Surfaced as a suggested edge only; see /tmp/track_c/suggested_edges.md.
- field: operational_status
  note: No post-notification gazette evidence that a Judge has assumed charge was located this run, and
    Notification No. II(2)/HO/887/2021 takes effect only 'with effect from the dates on which the Judges
    assume charge'. Active is therefore NOT independently confirmed for this court.
- field: id
  note: Notification No. II(2)/HO/887/2021 names the seat as 'Kancheepuram at Chengalpattu'. Whether the
    judicial district is Kancheepuram (with the court sitting at Chengalpattu) or Chengalpattu is not
    resolved by the notification. The id uses the seat; maintainer decision.
