  notes: 'NCLT publishes its own Annual Report on nclt.gov.in — verified live: "Annual Report 2024-25"
    (covering FY 2024-25, includes "From the Desk of the Hon''ble President" and a performance overview)
    and the prior "Annual Report 2023-2024" (nclt.gov.in/sites/default/files/2026-02/AR23-24%20web_file.pdf,
    also live). Both are hosted under a /2026-02/ upload path, suggesting a Feb 2026 site refresh/re-upload
    of both editions rather than two closely-timed separate publications — the document text itself does
    not carry an explicit publication/signing date, so last_published is left null rather than guessed;
    data_as_of instead records the FY-2024-25 reporting period end. Companies Act 2013 Ch. XXVII (NCLT/NCLAT
    provisions, ss.408-434) and IBC 2016 s.60 contain no annual-report-to-Parliament clause of the kind
    regulators have (cf. SEBI Act s.18) — statutorily_required left unknown, not no.'
