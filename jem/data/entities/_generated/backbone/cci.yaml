  notes: 'Competition Act 2002 s.53(2)-(3) requires CCI to prepare an annual report once a year and forward
    it to the Central Government (within 180 days of FY close per CCI (Form and Time of Preparation of
    Annual Report) Rules 2008), to be laid before each House of Parliament. CCI complies: "Annual Report
    2023-24" hosted on cci.gov.in, verified live. last_published is approximate — the PDF filename''s
    embedded Unix timestamp (1734695318) resolves to 2024-12-20, which matches contemporaneous reporting
    (The Hindu BusinessLine, published 23 Dec 2024, describing the report as tabled in Lok Sabha "this
    past week") rather than a date read directly off the document''s own text; flagged as approximate
    rather than exact. NOTE: the live cci.gov.in/annual-report repository page itself is a JS-rendered
    empty table shell at fetch time — the working PDF link was recovered via search, not by browsing the
    repository page, and the repository page URL alone would not have passed the liveness gate''s soft-404/homepage
    checks for a document claim.'
