  notes: IRDAI Act 1999 s.20(2)-(3) requires IRDAI to submit an annual report to the Central Government
    within 9 months of FY close, laid before each House of Parliament (form under IRDA (Annual Report
    - Furnishing of Return, Statements and Other Particulars) Rules 2000). IRDAI complies and has an unbroken
    run of published annual reports back to at least 2018-19; the "IRDAI Annual Report 2024-25" direct
    PDF link was recovered from irdai.gov.in's own annual-reports listing page (Liferay document-detail
    links do not resolve via simple fetch, so the direct /documents/... URL had to be extracted from page
    markup). last_published (2025-12-30) is taken from the portal's own "Issue Date" column for that report
    (cross-listed on intranet.irdai.gov.in and policyholder.gov.in), which differs slightly from the PDF
    file's embedded upload timestamp (resolves to 2026-01-05) — both are within days of each other and
    consistent with a Dec 2025 tabling followed by a Jan 2026 file re-upload; the portal Issue Date is
    used as the more report-specific field. Prior edition (Annual Report 2023-24, dated 23-12-2024 on
    the same portal) also verified live as a fallback citation.
