        accessed_date: '2026-09-24'

  - id: rel_mh_gov_notifies_ao
    source: government_maharashtra
    target: mh_fss_adjudicating_officer
    relationship_type: FormallyAppoints
    relationship_category: appointment
    is_binding: true
    is_constitutional: false
    statutory_basis: "Food Safety and Standards Act 2006, s.68(1) — officer not below the rank of Additional District Magistrate notified by the State Government as Adjudicating Officer"
    year_established: 2011
    data_quality: partial
    sources:
      - label: Food Safety and Standards Act 2006 (India Code)
        url: https://www.indiacode.nic.in/bitstream/123456789/7800/1/200634_food_safety_and_standards_act,_2006.pdf
        type: CentralAct
        accessed_date: '2026-09-24'

  - id: rel_mh_gov_appoints_fsat
    source: government_maharashtra
    target: mh_fsat
    relationship_type: FormallyAppoints
    relationship_category: appointment
    is_binding: true
    is_constitutional: false
    statutory_basis: "Food Safety and Standards Act 2006, s.70(1) and s.70(3) — State Government establishes the Tribunal and appoints its Presiding Officer by notification"
    year_established: 2011
    notes: Constituting notification not yet located. See mh_fsat data_quality_notes.
    data_quality: contested
    contested_note: >-
      The Tribunal's existence is documented through Bombay High Court
      judgments, not through a located Maharashtra Gazette notification.
    sources:
      - label: Food Safety and Standards Act 2006 (India Code)
        url: https://www.indiacode.nic.in/bitstream/123456789/7800/1/200634_food_safety_and_standards_act,_2006.pdf
        type: CentralAct
        accessed_date: '2026-09-24'

  - id: rel_mh_cfs_supervises_ao
    source: mh_commissioner_food_safety
    target: mh_fss_adjudicating_officer
    relationship_type: AdministrativeSupervision
    relationship_category: supervisory
    is_binding: true
    is_constitutional: false
    statutory_basis: "Maharashtra Recruitment Rules 2022 — Joint Commissioner (Food)-cum-Adjudicating Officer is a post in the Office of the Commissioner, Food and Drugs Administration"
    year_established: 2011
    notes: >-
      The Adjudicating Officer is a departmental officer under the
      Commissioner, though appointed to the adjudicating role by State
      Government notification (s.68(1)).
    data_quality: partial
    sources:
