    relationship_type: PolicyOversight
    relationship_category: supervisory
    is_binding: false
    is_constitutional: false
    statutory_basis: "Food Safety and Standards Act 2006, s.30(2)(b) and (d) — Commissioner ensures compliance with standards notified by the Food Authority; s.30(2)(f) — further functions prescribed by the State Government in consultation with the Food Authority"
