# Maharashtra food safety chain under the Food Safety and Standards Act 2006.
# Two appellate streams from the same regulator:
#   Stream A (licence orders, s.32): Designated Officer -> Commissioner of Food Safety (final) -> writ, Bombay HC
#   Stream B (penalty orders, s.68): Adjudicating Officer -> Food Safety Appellate Tribunal -> Bombay HC (s.71(6))
# Hand-curated. data_quality: partial unless stated.
relationships:

  # ── Stream A: licence suspension / cancellation ──────────────────────────
  - id: rel_mh_fda_do_appeal_cfs
    source: mh_fda_designated_officer
    target: mh_commissioner_food_safety
    relationship_type: AppealableTo
    relationship_category: appellate_chain
    is_binding: true
    is_constitutional: false
    statutory_basis: "Food Safety and Standards Act 2006, s.32(4) — appeal to the Commissioner of Food Safety, whose decision shall be final"
    year_established: 2011
    notes: >-
      Only appeal against an improvement notice, refusal of an improvement
      certificate, or suspension, cancellation, or revocation of licence.
      Appeal window 15 days (s.32(5)). The appellate authority appoints the
      Designated Officer (s.36(1)) and heads the same department.
    data_quality: partial
    sources:
      - label: Food Safety and Standards Act 2006, s.32 (Indian Kanoon)
        url: https://indiankanoon.org/doc/1292719/
        type: CentralAct
        accessed_date: '2026-09-24'

  - id: rel_mh_cfs_appoints_do
    source: mh_commissioner_food_safety
    target: mh_fda_designated_officer
    relationship_type: FormallyAppoints
    relationship_category: appointment
    is_binding: true
    is_constitutional: false
    statutory_basis: "Food Safety and Standards Act 2006, s.36(1) — the Commissioner of Food Safety shall, by order, appoint the Designated Officer"
    year_established: 2011
    notes: >-
      The power to appoint Designated Officers cannot be delegated (s.30(3)).
      Closes the loop with rel_mh_fda_do_appeal_cfs: the appellate authority
      is the appointing authority.
    data_quality: partial
    sources:
      - label: Food Safety and Standards Act 2006 (India Code)
        url: https://www.indiacode.nic.in/bitstream/123456789/7800/1/200634_food_safety_and_standards_act,_2006.pdf
        type: CentralAct
        accessed_date: '2026-09-24'

  - id: rel_mh_cfs_supervises_do
    source: mh_commissioner_food_safety
    target: mh_fda_designated_officer
    relationship_type: AdministrativeSupervision
    relationship_category: supervisory
    is_binding: true
    is_constitutional: false
    statutory_basis: "Food Safety and Standards Act 2006, s.30(2)(d) — ensure efficient and uniform implementation; s.36(1) — Designated Officer in charge of food safety administration in the area specified"
    year_established: 2011
    data_quality: partial
    sources:
      - label: Food Safety and Standards Act 2006, s.30 (Indian Kanoon)
        url: https://indiankanoon.org/doc/934148/
        type: CentralAct
        accessed_date: '2026-09-24'

  - id: rel_mh_cfs_writ_hc_bombay
    source: mh_commissioner_food_safety
    target: hc_bombay
    relationship_type: AppealableTo
    relationship_category: appellate_chain
    is_binding: false
    is_constitutional: true
    constitutional_basis: "Constitution of India, Article 226 — writ jurisdiction of the High Court"
    statutory_basis: null
    year_established: 2011
    notes: >-
      Not a statutory appeal. s.32(4) makes the Commissioner's decision final,
      so the only route beyond the Commissioner is a writ petition. Recorded
      as an appellate-chain arc so the map shows where the s.32 stream ends.
    data_quality: partial
    sources:
      - label: Food Safety and Standards Act 2006, s.32 (Indian Kanoon)
        url: https://indiankanoon.org/doc/1292719/
        type: CentralAct
        accessed_date: '2026-09-24'

  # ── Stream B: monetary penalties ─────────────────────────────────────────
  - id: rel_mh_fss_ao_appeal_fsat
    source: mh_fss_adjudicating_officer
    target: mh_fsat
    relationship_type: AppealableTo
    relationship_category: appellate_chain
    is_binding: true
    is_constitutional: false
    statutory_basis: "Food Safety and Standards Act 2006, s.70(1) — Tribunal to hear appeals from the decisions of the Adjudicating Officer under s.68"
    year_established: 2011
    notes: >-
      Penalty orders only. Licence suspension and cancellation orders under
      s.32 are outside the Tribunal's jurisdiction.
    data_quality: partial
    sources:
      - label: Food Safety and Standards Act 2006 (India Code)
        url: https://www.indiacode.nic.in/bitstream/123456789/7800/1/200634_food_safety_and_standards_act,_2006.pdf
        type: CentralAct
        accessed_date: '2026-09-24'

  - id: rel_mh_fsat_appeal_hc_bombay
    source: mh_fsat
    target: hc_bombay
    relationship_type: AppealableTo
    relationship_category: appellate_chain
    is_binding: true
    is_constitutional: false
    statutory_basis: "Food Safety and Standards Act 2006, s.71(6) — appeal to the High Court within sixty days on any question of fact or law"
    year_established: 2011
    notes: >-
      Documented in practice: First Appeal 158 of 2016 (from FSAT Yavatmal,
      decided 8 Dec 2020) and Appeal Against Order 19 of 2019 (from FSAT
      Buldhana, decided 9 May 2024, 2024:BHC-NAG:5692) were both s.71(6)
      appeals from Tribunal orders, Bombay HC Nagpur Bench.
    data_quality: partial
    sources:
      - label: State of Maharashtra (FDA) v Ruchi Soya Industries Ltd, First Appeal 158 of 2016, Bombay HC Nagpur Bench, 8 December 2020 (official PDF)
        url: https://bombayhighcourt.gov.in/bhc/judgments/order-pdf/HCBM040287702014/2020-12-08/7?
        type: HCJudgment
        accessed_date: '2026-09-24'
      - label: Tata Chemicals Ltd v State of Maharashtra, Appeal Against Order 19 of 2019, 2024:BHC-NAG:5692, 9 May 2024 (official PDF)
        url: https://bombayhighcourt.gov.in/bhc/judgments/order-pdf/HCBM040036442017/2024-05-09/29?
        type: HCJudgment
        accessed_date: '2026-09-24'

