        url: https://www.legitquest.com/act/joint-commissioner-food-cum-adjudicating-officer-group-a-assistant-commissioner-food-cum-designated-officer-group-a-and-food-safety-officer-group-b/C78E
        type: GazetteNotification
        accessed_date: '2026-09-24'

  - id: rel_mh_cfs_policy_fssai
