# ledger/prompt_registry.yaml — the INPUT ledger (mirror of the output run-ledger)
#
# A prompt is a versioned config that generates data, so it carries the same
# provenance discipline as leaf data. Store this IN GITHUB: git history IS the
# changelog. friedso may serve a build-derived JSON view for the UI, but the
# source of truth stays here in the repo.
#
# Self-improvement loop:
#   output ledger + consensus/expert finding on quality
#     → log revision_trigger  → bump version  → old row status: superseded
#     → registry changelog (this file's git history)
#
# The agent NEVER edits its own prompt mid-run (that forks prompt_version
# silently). Only this deliberate, versioned loop changes a prompt.

