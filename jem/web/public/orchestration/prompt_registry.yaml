  # ── Dispatch prompts ──────────────────────────────────────────────────────
  # A dispatch prompt is a governing track prompt plus the run-specific context
  # an agent cannot discover for itself: hosts already proven unreachable, where
  # staging output goes, and what counts as success. It is a different artifact
  # with different content, so it is registered separately and a run cites the
  # prompt that actually governed it, not the one it was derived from.

  - prompt_id: dispatch-cursor-C-commercial
    version: v1
    track: generation
    derived_from: cursor-C-commercial-v1
    purpose: >
      Track C as dispatched: governing prompt plus the tested TN source map, the
      liveness-gate invocation, staging paths, and an explicit statement that a
      documented empty result is a successful run.
    path: ledger/prompts/dispatch/C_track_dispatch_v1.md
    model: claude-opus-5
    status: active
    created: '2026-09-01'
    superseded_by: null
    revision_trigger: null
    linked_run_ids:
